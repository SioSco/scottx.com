<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/anagramma/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Turn chaos into words. One word. Every tile. Can you find it?">
  <meta name="theme-color" content="#F2EFE6">

  <!-- Link previews (social posts, messages). og:url and og:image must be
       absolute; they assume the game is published at
       https://scottx.com/anagramma/ (see site/README.md). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Anagramma">
  <meta property="og:title" content="Anagramma">
  <meta property="og:description" content="Turn chaos into words. One word. Every tile. Can you find it?">
  <meta property="og:url" content="https://scottx.com/anagramma/">
  <meta property="og:image" content="https://scottx.com/anagramma/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anagramma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anagramma</title>
  <link rel="manifest" href="manifest.json">
</head>
<!-- The game's paper background, so the page never flashes white while
     the engine loads. -->
<body style="margin: 0; background: #F2EFE6;">
  <noscript>
    <p style="font-family: Georgia, serif; color: #202321; text-align: center; padding: 48px 16px;">
      Anagramma needs JavaScript turned on to play.
    </p>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- While the game loads: the same row of full stops the game itself shows
       (lib/widgets/loading_dots.dart): one to ten, one more every half
       second, the width of all ten reserved from the start, at the top where
       the title goes, on the same paper. Taken down by the game when its own
       screen is ready. -->
  <div id="loading" aria-hidden="true" style="position: fixed; inset: 0; z-index: 10; background: #F2EFE6; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; justify-content: center; align-items: flex-start;">
    <div style="height: 150px; display: flex; align-items: center; font-family: sans-serif; font-size: 38px; font-weight: 900; line-height: 1; letter-spacing: 6px; color: #202321; white-space: nowrap;"><span id="loading-shown">.</span><span id="loading-rest" style="color: transparent;">.........</span></div>
  </div>
  <script>
    (function () {
      var shown = document.getElementById('loading-shown');
      var rest = document.getElementById('loading-rest');
      var count = 1;
      var timer = setInterval(function () {
        if (!shown || !rest || count >= 10) { clearInterval(timer); return; }
        count++;
        shown.textContent = '.'.repeat(count);
        rest.textContent = '.'.repeat(10 - count);
      }, 500);
    })();
    // The game takes the dots down itself (lib/services/page_loading.dart)
    // once its own screen is ready, so the dots run on, unbroken, to the
    // title. This is only a safety net should the game never come up.
    setTimeout(function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    }, 60000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
