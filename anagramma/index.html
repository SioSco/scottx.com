<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/anagramma/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Turn chaos into words. Start with four letters and work your way to twelve.">
  <meta name="theme-color" content="#F2EFE6">

  <!-- Link previews (social posts, messages). og:url and og:image must be
       absolute; they assume the game is published at
       https://scottx.com/anagramma/ (see site/README.md). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Anagramma">
  <meta property="og:title" content="Anagramma">
  <meta property="og:description" content="Turn chaos into words. Start with four letters and work your way to twelve.">
  <meta property="og:url" content="https://scottx.com/anagramma/">
  <meta property="og:image" content="https://scottx.com/anagramma/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anagramma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anagramma</title>
  <link rel="manifest" href="manifest.json">
</head>
<!-- The game's paper background, so the page never flashes white while
     the engine loads. -->
<body style="margin: 0; background: #F2EFE6;">
  <noscript>
    <p style="font-family: Georgia, serif; color: #202321; text-align: center; padding: 48px 16px;">
      Anagramma needs JavaScript turned on to play.
    </p>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- While the game loads: its name, set like a title page, on the same
       paper. Removed as soon as the game draws its first frame. -->
  <div id="loading" aria-hidden="true" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 40px; color: #505551; letter-spacing: 1px;">Anagramma</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
